name: Move issues to Pre-release on PR to main

on:
  pull_request:
    types: [opened, reopened, edited]
    branches: [main]

jobs:
  move-to-pre-release:
    if: github.event.pull_request.head.ref == 'dev'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Extract issue numbers from PR body
        id: extract
        shell: bash
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          ISSUES=$(printf '%s' "$PR_BODY" \
            | grep -oiE '(close[sd]?|fix(es|ed)?|resolve[sd]?)[[:space:]]+#[0-9]+' \
            | grep -oE '[0-9]+' \
            | sort -un \
            | paste -sd, - || true)
          echo "issues=$ISSUES" >> "$GITHUB_OUTPUT"

      - name: Determine target status
        id: target
        shell: bash
        env:
          MERGED: ${{ github.event.pull_request.merged }}
        run: |
          if [[ "$MERGED" == "true" ]]; then
            echo "status=Done" >> "$GITHUB_OUTPUT"
          else
            echo "status=Pre-release" >> "$GITHUB_OUTPUT"
          fi

      - name: Update project status
        if: steps.extract.outputs.issues != ''
        continue-on-error: true
        uses: ./.github/actions/update-project-status
        with:
          github-token: ${{ secrets.GH_PROJECT_TOKEN }}
          issue-numbers: ${{ steps.extract.outputs.issues }}
          target-status: ${{ steps.target.outputs.status }}
          forbidden-source-statuses: 'Done'

name: Tests

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: midgard
          POSTGRES_USER: midgard
          POSTGRES_PASSWORD: midgard
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U midgard -d midgard"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DB_NAME: midgard
      DB_USER: midgard
      DB_PASSWORD: midgard
      DB_HOST: localhost
      DB_PORT: 5432
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/*.txt

      - name: Install dependencies
        run: pip install -r requirements/test.txt

      - name: Run tests
        run: >
          pytest
          --cov=apps.vor_archives
          --cov-report=term-missing:skip-covered
          --ignore=src/tests/e2e
          src/

  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: midgard
          POSTGRES_USER: midgard
          POSTGRES_PASSWORD: midgard
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U midgard -d midgard"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DB_NAME: midgard
      DB_USER: midgard
      DB_PASSWORD: midgard
      DB_HOST: localhost
      DB_PORT: 5432
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/*.txt

      - name: Install dependencies
        run: pip install -r requirements/playwright.txt

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('requirements/playwright.txt') }}

      - name: Install Playwright browsers
        run: playwright install --with-deps chromium

      - name: Download vendor static
        run: |
          sed -i 's/\r$//' docker/web/download_static.sh
          bash docker/web/download_static.sh

      - name: Run e2e (smoke)
        run: pytest src/tests/e2e -m smoke

  vitest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test

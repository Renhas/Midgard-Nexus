name: Tests

on:
  push:
  pull_request:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: midgard
          POSTGRES_USER: midgard
          POSTGRES_PASSWORD: midgard
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U midgard -d midgard"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DB_NAME: midgard
      DB_USER: midgard
      DB_PASSWORD: midgard
      DB_HOST: localhost
      DB_PORT: 5432
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/*.txt

      - name: Install dependencies
        run: pip install -r requirements/development.txt

      - name: Run tests
        run: pytest

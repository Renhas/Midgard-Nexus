name: Security

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

concurrency:
  group: sec-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/*.txt

      - name: Install production dependencies
        run: pip install -r requirements/production.txt

      - name: Django deploy check
        working-directory: src
        env:
          DJANGO_SETTINGS_MODULE: config.settings.production
          # Fake key, only for CI. Must not match the placeholder that
          # production.py rejects, and must not look like a real secret.
          DJANGO_SECRET_KEY: ci-only-not-a-real-key-0123456789abcdefghij
          DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
        run: python manage.py check --deploy --fail-level=ERROR

  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Audit dependencies
        uses: pypa/gh-action-pip-audit@v1.0.0
        with:
          inputs: requirements/production.txt

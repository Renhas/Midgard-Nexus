name: Move issue to In progress on branch create

on:
  create:

jobs:
  move-to-in-progress:
    runs-on: ubuntu-latest
    if: github.event.ref_type == 'branch'

    steps:
      - uses: actions/checkout@v4

      - name: Extract issue number from branch
        id: extract
        shell: bash
        env:
          BRANCH: ${{ github.event.ref }}
        run: |
          if [[ "$BRANCH" =~ /([0-9]+)(-|$) ]]; then
            echo "issues=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          else
            echo "issues=" >> "$GITHUB_OUTPUT"
            echo "No issue number found in branch \"$BRANCH\""
          fi

      - name: Update project status
        if: steps.extract.outputs.issues != ''
        continue-on-error: true
        uses: ./.github/actions/update-project-status
        with:
          github-token: ${{ secrets.GH_PROJECT_TOKEN }}
          issue-numbers: ${{ steps.extract.outputs.issues }}
          target-status: 'In progress'
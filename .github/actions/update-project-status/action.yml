name: 'Update Project Status'
description: 'Moves one or more issues to a given status in a GitHub Project'

inputs:
  github-token:
    description: 'PAT with project scope'
    required: true
  issue-numbers:
    description: 'Comma-separated list of issue numbers (e.g. "12,34,56")'
    required: true
  target-status:
    description: 'Target status name (e.g. "In progress")'
    required: true
  project-title:
    description: 'Project title'
    required: false
    default: 'Midgard-Nexus-project'
  status-field-name:
    description: 'Status field name'
    required: false
    default: 'Status'

runs:
  using: 'composite'
  steps:
    - name: Update project status
      uses: actions/github-script@v7
      env:
        ISSUE_NUMBERS: ${{ inputs.issue-numbers }}
        TARGET_STATUS: ${{ inputs.target-status }}
        PROJECT_TITLE: ${{ inputs.project-title }}
        STATUS_FIELD_NAME: ${{ inputs.status-field-name }}
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          // === 1. Разбираем список issues ===
          const issueNumbers = process.env.ISSUE_NUMBERS
            .split(',')
            .map(s => s.trim())
            .filter(s => s.length > 0)
            .map(Number)
            .filter(n => Number.isInteger(n) && n > 0);
          if (issueNumbers.length === 0) {
            console.log('No valid issue numbers provided, skipping');
            return;
          }

          const targetStatus = process.env.TARGET_STATUS;
          const projectTitle = process.env.PROJECT_TITLE;
          const statusFieldName = process.env.STATUS_FIELD_NAME;
          console.log(`Updating issues [${issueNumbers.join(', ')}] to "${targetStatus}"`);

          // === 2. Резолвим проект (в try/catch) ===
          let project, statusField, targetOption;
          try {
            const projectQuery = `
              query($owner: String!, $repo: String!) {
                repository(owner: $owner, name: $repo) {
                  projectsV2(first: 20) { nodes { id title } }
                }
              }
            `;
            const projectResult = await github.graphql(projectQuery, {
              owner: context.repo.owner,
              repo: context.repo.repo
            });
            project = projectResult.repository.projectsV2.nodes.find(
              p => p.title === projectTitle
            );
            if (!project) {
              console.log(`Project "${projectTitle}" not found, skipping`);
              return;
            }

            const fieldQuery = `
              query($projectId: ID!) {
                node(id: $projectId) {
                  ... on ProjectV2 {
                    field(name: "${statusFieldName}") {
                      ... on ProjectV2SingleSelectField {
                        id
                        options { id name }
                      }
                    }
                  }
                }
              }
            `;
            const fieldResult = await github.graphql(fieldQuery, { projectId: project.id });
            statusField = fieldResult.node.field;
            if (!statusField) {
              console.log(`Field "${statusFieldName}" not found, skipping`);
              return;
            }
            targetOption = statusField.options.find(o => o.name === targetStatus);
            if (!targetOption) {
              console.log(`Option "${targetStatus}" not found, skipping`);
              return;
            }
          } catch (err) {
            console.log(`Failed to resolve project/field/option: ${err.message}`);
            return; // не падаем, просто выходим
          }

          // === 3. Обновляем каждую issue, глотая ошибки по одной ===
          const itemQuery = `
            query($owner: String!, $repo: String!, $issue: Int!) {
              repository(owner: $owner, name: $repo) {
                issue(number: $issue) {
                  projectItems(first: 10) {
                    nodes { id project { id } }
                  }
                }
              }
            }
          `;
          const mutation = `
            mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $optionId: String!) {
              updateProjectV2ItemFieldValue(
                input: {
                  projectId: $projectId
                  itemId: $itemId
                  fieldId: $fieldId
                  value: { singleSelectOptionId: $optionId }
                }
              ) { projectV2Item { id } }
            }
          `;

          for (const issueNumber of issueNumbers) {
            try {
              const result = await github.graphql(itemQuery, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue: issueNumber
              });
              const issue = result?.repository?.issue;
              if (!issue) {
                console.log(`Issue #${issueNumber} not found, skipping`);
                continue;
              }
              const projectItem = issue.projectItems.nodes.find(
                item => item.project.id === project.id
              );
              if (!projectItem) {
                console.log(`Issue #${issueNumber} is not in project "${projectTitle}", skipping`);
                continue;
              }
              await github.graphql(mutation, {
                projectId: project.id,
                itemId: projectItem.id,
                fieldId: statusField.id,
                optionId: targetOption.id
              });
              console.log(`Issue #${issueNumber} moved to "${targetStatus}"`);
            } catch (err) {
              console.log(`Failed to update issue #${issueNumber}: ${err.message}`);
              // продолжаем цикл, не падаем
            }
          }

          console.log('Done.');
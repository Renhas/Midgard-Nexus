{% extends "base.html" %}

{% block header %}
<nav class="navbar navbar-dark fixed-top">
    <div class="container-fluid">
        <!-- Left: Home + Module Icons -->
        <div class="d-flex align-items-center gap-2">
            <a class="btn btn-outline-light btn-sm" href="{% url 'home' %}" title="Главная">
                <i class="bi bi-house-fill"></i>
            </a>
            <div class="vr bg-secondary opacity-50"></div>
            <a class="btn btn-outline-light btn-sm" href="{% url 'vor_archives:index' %}" title="{{ modules.0.name }}">
                <i class="{{ modules.0.icon }} fs-4"></i>
            </a>
            <a class="btn btn-outline-light btn-sm" href="{% url 'fafnir_cave:index' %}" title="{{ modules.1.name }}">
                <i class="{{ modules.1.icon }} fs-4"></i>
            </a>
            <a class="btn btn-outline-light btn-sm" href="{% url 'kvasir_records:index' %}" title="{{ modules.2.name }}">
                <i class="{{ modules.2.icon }} fs-4"></i>
            </a>
        </div>

        <!-- Right: Search + Avatar -->
        <div class="d-flex align-items-center gap-2">
            <button class="btn btn-outline-light btn-sm" type="button" title="Поиск">
                <i class="bi bi-search"></i>
            </button>

        {% include 'partials/user_avatar_dropdown.html' with btn_class='btn-outline-light' %}
        </div>
    </div>
</nav>
<div class="navbar-spacer"></div>
{% endblock %}

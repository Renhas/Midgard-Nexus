{% if user.is_authenticated %}
<div class="dropdown {{ dropdown_class|default:'' }}" x-data="{ open: false }">
    <button class="nav-btn dropdown-toggle d-flex align-items-center gap-2"
            type="button"
            @click="open =!open"
            @click.outside="open = false"
            :aria-expanded="open">
        <i class="bi bi-person-circle header-icon"></i>
        <span class="d-none d-sm-inline">{{ user.get_full_name|default:user.username }}</span>
    </button>
    <ul class="dropdown-menu dropdown-menu-end" style="left: auto !important; right: 0;" :class="{ 'show': open }">
        <li><a class="dropdown-item" href="{% url 'users:profile' %}">
            <i class="bi bi-person-circle"></i> Профиль
        </a></li>
        <li><hr class="dropdown-divider"></li>
        <li>
            <form action="{% url 'logout' %}" method="post" class="d-inline w-100">
                {% csrf_token %}
                <button type="submit" class="dropdown-item text-danger border-0 bg-transparent w-100 text-start">
                    <i class="bi bi-box-arrow-right"></i> Выйти
                </button>
            </form>
        </li>
    </ul>
</div>
{% else %}
<a href="{% url 'users:login' %}" class="nav-btn d-flex align-items-center gap-2">
    <i class="bi bi-person-circle header-icon"></i>
    <span class="d-none d-sm-inline">Войти</span>
</a>
{% endif %}

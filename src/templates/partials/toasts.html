{{ toast_config|json_script:"app-toast-config" }}
<div class="app-toast-viewport"
     x-data
     x-init="$store.toasts.init()"
     :class="{ 'app-toast-viewport--expanded': $store.toasts.expanded }"
     @mouseenter="$store.toasts.expand()"
     @mouseleave="$store.toasts.scheduleCollapse()"
     @focusin="$store.toasts.onFocusIn($event)"
     @focusout="$store.toasts.onFocusOut()"
     aria-live="polite"
     aria-atomic="false">
  <div class="app-toast-controls" x-show="$store.toasts.hasMultiple" x-cloak>
    <button type="button" class="app-toast-clear-all" @click="$store.toasts.dismissAll()">
      <i class="bi bi-x-lg"></i>
      <span>Закрыть все</span>
    </button>
  </div>
  <div class="app-toast-stack">
    <template x-for="item in $store.toasts.visibleItems" :key="item.id">
      <div class="app-toast"
           :class="[
               'app-toast--' + item.level,
               { 'app-toast--closing': item.closing }
           ]"
           :style="`--stack-index: ${item.stackIndex}; --toast-duration: ${item.duration}ms`"
           role="status">
        <div class="app-toast__icon">
          <i class="bi"
             :class="{
                 'bi-check-circle-fill': item.level === 'success',
                 'bi-exclamation-circle-fill': item.level === 'error',
                 'bi-info-circle-fill': item.level === 'info'
             }"></i>
        </div>
        <div class="app-toast__body">
          <div class="app-toast__message" x-text="item.message"></div>
          <div class="app-toast__actions" x-show="item.action || item.details" x-cloak>
            <template x-if="item.action">
              <button type="button"
                      class="app-toast__action-btn"
                      @click="$store.toasts.triggerAction(item)"
                      x-text="item.action.label"></button>
            </template>
            <template x-if="item.details">
              <button type="button"
                      class="app-toast__action-btn app-toast__action-btn--copy"
                      @click="$store.toasts.copyDetails(item, $event)"
                      :title="item.copied ? 'Скопировано' : 'Скопировать детали ошибки'">
                <i class="bi" :class="item.copied ? 'bi-check2' : 'bi-clipboard'"></i>
                <span x-text="item.copied ? 'Скопировано' : 'Скопировать'"></span>
              </button>
            </template>
          </div>
        </div>
        <button type="button"
                class="app-toast__close"
                title="Закрыть"
                aria-label="Закрыть уведомление"
                @click="$store.toasts.dismiss(item.id)">
          <i class="bi bi-x-lg"></i>
        </button>
        <div class="app-toast__progress"
             x-show="item.duration > 0"
             @animationend.self="$store.toasts.onProgressEnd(item.id)"></div>
      </div>
    </template>
  </div>
</div>

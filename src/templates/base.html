{% load static %}
<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Midgard Nexus{% endblock %}</title>
    <link rel="icon" type="image/x-icon" href="{% static 'images/favicon.ico' %}">
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="{% static 'vendor/bootstrap/css/bootstrap.min.css' %}">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="{% static 'vendor/bootstrap/css/bootstrap-icons.css' %}">
    <!-- Lucide Icons -->
    <link rel="stylesheet" href="{% static 'vendor/lucide/css/lucide.min.css' %}">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{% static 'css/main.css' %}">
    {% block extra_head %}{% endblock %}
  </head>
  <body>
    {% block header %}{% endblock %}
    <main>
      {% block content %}{% endblock %}
    </main>
    <!-- HTMX -->
    <script src="{% static 'vendor/htmx/htmx.min.js' %}"></script>
    <!-- Alpine.js -->
    <script src="{% static 'vendor/alpine/alpine.min.js' %}" defer></script>
    <!-- Bootstrap JS -->
    <script src="{% static 'vendor/bootstrap/js/bootstrap.bundle.min.js' %}"></script>
    <!-- Chart.js -->
    <script src="{% static 'vendor/chart/chart.min.js' %}"></script>
    <!-- Chart WordCloud -->
    <script src="{% static 'vendor/wordcloud/chartjs-chart-wordcloud.min.js' %}"></script>
    <!-- Sortable.js -->
    <script src="{% static 'vendor/sortable/Sortable.min.js' %}"></script>
    {% block extra_js %}{% endblock %}
  </body>
</html>

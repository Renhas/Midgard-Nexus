{% load vor_archives_extras %}
<div class="artwork-row"
     data-uw-id="{{ user_work.pk }}"
     hx-get="{% url 'vor_archives:artwork_detail' user_work.pk %}"
     hx-target="#vor-overlay"
     hx-swap="innerHTML"
     :class="{ 'is-selected': $store.vorArtworks.isSelected({{ user_work.pk }}) }">
    <div class="artwork-row-check" x-show="$store.vorArtworks.deleteMode" x-cloak @click.stop>
        <label class="vor-check-label">
            <input type="checkbox"
                   class="hidden-checkbox"
                   :checked="$store.vorArtworks.isSelected({{ user_work.pk }})"
                   @change="$store.vorArtworks.toggleSelected({{ user_work.pk }})">
            <span class="custom-checkbox"></span>
        </label>
    </div>
    <div class="artwork-row-type">
        <i class="{{ user_work|get_work_type_icon }}"></i>
    </div>
    <div class="artwork-row-title" title="{{ user_work.work.title }}">
        {{ user_work.work.title }}
    </div>
    <div class="artwork-row-year">
        {% if user_work.work.release_date %}
            {{ user_work.work.release_date|date:'Y' }}
        {% endif %}
    </div>
    <div class="artwork-row-status status-{{ user_work.status }}">
        {{ user_work.get_status_display }}
    </div>
    <div class="artwork-row-rating">
        {% if user_work.rating %}
            {{ user_work.rating }}
        {% else %}
            —
        {% endif %}
    </div>
    <div class="artwork-row-progress">
        {{ user_work|format_progress }}
    </div>
    <div class="artwork-row-actions">
        <button type="button"
                class="sidebar-btn sidebar-btn-delete sidebar-btn-icon artwork-row-delete"
                title="Удалить"
                x-show="!$store.vorArtworks.deleteMode"
                @click.stop
                hx-get="{% url 'vor_archives:artwork_delete_preview' %}?ids={{ user_work.pk }}"
                hx-target="#vor-modal"
                hx-swap="innerHTML">
            <i class="bi bi-trash"></i>
        </button>
    </div>
</div>

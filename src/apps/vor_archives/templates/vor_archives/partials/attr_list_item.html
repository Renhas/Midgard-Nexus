<div class="attr-item"
     data-attr-id="{{ item.key }}"
     :class="{
         'is-active': $store.vorAttributes.selectedKey === '{{ item.key }}',
         'is-selected': $store.vorAttributes.isSelected('{{ item.key }}')
     }"
     hx-get="{% url 'vor_archives:genre_detail' item.type_key item.pk %}"
     hx-target="#attr-detail"
     hx-swap="innerHTML"
     hx-disinherit="hx-include"
     @click="$store.vorAttributes.select('{{ item.key }}')">
    <div class="attr-item-check" x-show="$store.vorAttributes.deleteMode" x-cloak>
        <span class="custom-checkbox"
              :class="{ 'is-checked': $store.vorAttributes.isSelected('{{ item.key }}') }"></span>
    </div>
    <span class="attr-item-name">{{ item.name }}</span>
    <span class="attr-item-count">({{ item.work_count }})</span>
</div>

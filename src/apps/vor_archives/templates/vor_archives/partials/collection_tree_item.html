{% if collection.get_children.all %}
<div class="collection-tree-node" x-data="{ expanded: false }">
    <div class="collection-item" style="padding-left: {{ collection.level|default:0 }}px">
        <button type="button"
                class="collection-toggle"
                @click="expanded = !expanded"
                title="Свернуть/Развернуть">
            <i class="bi bi-chevron-right" x-bind:class="{ 'bi-rotate-90': expanded }"></i>
        </button>
        <span>{{ collection.name }}</span>
    </div>
    <div x-show="expanded" style="padding-left: 16px;">
        {% for child in collection.get_children.all %}
            {% include "vor_archives/partials/collection_tree_item.html" with collection=child %}
        {% endfor %}
    </div>
</div>
{% else %}
<div class="collection-item" style="padding-left: {{ collection.level|default:0 }}px">
    <span class="collection-toggle-placeholder"></span>
    <span>{{ collection.name }}</span>
</div>
{% endif %}

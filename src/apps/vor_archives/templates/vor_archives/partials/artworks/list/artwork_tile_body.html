{% load vor_archives_extras %}
<div class="artwork-tile"
     hx-get="{% url 'vor_archives:artworks:detail' user_work.pk %}"
     hx-target="#vor-overlay"
     hx-swap="innerHTML"
     @contextmenu.prevent="$store.vorArtworks.openArtworkMenu($event, $el.closest('.artwork-item'))">
  <div class="artwork-tile-cover">
    {% if user_work.work.cover %}
      <img class="artwork-tile-image" src="{{ user_work.work.cover.url }}" alt="{{ user_work.work.title }}">
    {% else %}
      <div class="artwork-tile-image artwork-tile-image-empty">
        <i class="{{ user_work|get_work_type_icon }}"></i>
      </div>
    {% endif %}
    <div class="artwork-tile-status status-{{ user_work.status }}" title="{{ user_work|status_label_ru }}">
      <i class="{{ user_work|status_icon }}"></i>
    </div>
    <div class="artwork-tile-type">
      <i class="{{ user_work|get_work_type_icon }}"></i>
    </div>
    {% if user_work.rating %}
      <div class="artwork-tile-rating">
        <i class="bi bi-star-fill"></i>
        <span>{{ user_work.rating }}</span>
      </div>
    {% endif %}
    <div class="artwork-tile-check">
      <span class="custom-checkbox"></span>
    </div>
    <button type="button"
            class="sidebar-btn sidebar-btn-delete sidebar-btn-icon artwork-tile-delete"
            title="Удалить"
            @click.stop
            hx-get="{% url 'vor_archives:artworks:delete_preview' %}?ids={{ user_work.pk }}"
            hx-target="#vor-modal"
            hx-swap="innerHTML">
      <i class="bi bi-trash-fill"></i>
    </button>
  </div>
  <div class="artwork-tile-title" title="{{ user_work.work.title }}">{{ user_work.work.title }}</div>
</div>

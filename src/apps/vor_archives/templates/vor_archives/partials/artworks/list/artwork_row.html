{% load vor_archives_extras %}
<div class="artwork-item"
     data-uw-id="{{ user_work.pk }}"
     data-work-type="{{ user_work.work_content_type.model }}"
     data-work-id="{{ user_work.work_object_id }}"
     data-detail-url="{% url 'vor_archives:artworks:detail' user_work.pk %}"
     data-preview-title="{{ user_work.work.title }}"
     data-preview-desc="{{ user_work.work.description|default:'' }}"
     data-preview-cover="{% if user_work.work.cover %}{{ user_work.work.cover.url }}{% endif %}"
     data-preview-icon="{{ user_work|get_work_type_icon }}">
  {% include "vor_archives/partials/artworks/list/artwork_row_body.html" with user_work=user_work %}
  {% include "vor_archives/partials/artworks/list/artwork_tile_body.html" with user_work=user_work %}
</div>

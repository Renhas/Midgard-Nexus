        <span x-text="releaseDate ? formatDate(releaseDate) : 'Выбрать'"></span>
        <i class="bi bi-calendar3"></i>
    </button>
    {% include "vor_archives/partials/common/date_picker.html" %}
</div>
{% if not is_add %}

{% endif %}

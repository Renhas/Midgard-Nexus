<div class="sidebar-accordion" {% if show %}x-show="{{ show }}"{% endif %} x-data="{ query: '' }">
  <button type="button"
          class="sidebar-btn sidebar-btn--full sidebar-btn--accordion"
          aria-controls="attr-body-{{ kind }}"
          :aria-expanded="(openAttrAccordion === '{{ kind }}').toString()"
          @click="toggleAttrAccordion('{{ kind }}')">
    <span>{{ title }}</span>
    <i class="bi bi-chevron-right" :class="{ 'bi-rotate-90': openAttrAccordion === '{{ kind }}' }"></i>
  </button>
  <div id="attr-body-{{ kind }}" class="sidebar-accordion__body" x-show="openAttrAccordion === '{{ kind }}'" x-cloak>
    <input class="vor-chip-picker__search sidebar-accordion__search"
           type="text"
           placeholder="Поиск"
           x-model="query"
           @click.stop>
    <template x-for="opt in filterCatalog('{{ kind }}', query)" :key="'{{ kind }}'+opt.id">
      <label class="sidebar-accordion__item" @click.prevent="toggleAttr('{{ kind }}', opt)">
        <input class="vor-checkbox__input" type="checkbox" :checked="hasAttr('{{ kind }}', opt.id)">
        <span class="vor-checkbox"></span>
        <span x-text="opt.name"></span>
      </label>
    </template>
    <div class="vor-chip-picker__empty" x-show="query.trim() && !filterCatalog('{{ kind }}', query).length" x-cloak>
      Ничего не найдено
    </div>
  </div>
</div>

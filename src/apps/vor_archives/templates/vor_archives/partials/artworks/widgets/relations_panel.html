{% if not is_add %}
  <aside class="vor-view-relations">
    <div class="vor-relations-head">
      <div class="vor-relations-head-side">
        <button type="button"
                class="sidebar-btn sidebar-btn-icon vor-relations-head-btn"
                x-show="editing && relAdding"
                x-cloak
                title="Назад"
                @click="cancelRelationAdd()">
          <i class="bi bi-arrow-left"></i>
        </button>
      </div>
      <h3 class="vor-relations-title" x-text="relAdding ? 'Добавление' : 'Связи'">Связи</h3>
      <div class="vor-relations-head-side">
        <button type="button"
                class="sidebar-btn sidebar-btn-add sidebar-btn-icon vor-relations-head-btn"
                x-show="editing && !relAdding"
                x-cloak
                title="Добавить связь"
                @click="startRelationAdd()">
          <i class="bi bi-plus-lg"></i>
        </button>
        <button type="button"
                class="sidebar-btn sidebar-btn-add sidebar-btn-icon vor-relations-head-btn"
                x-show="editing && relAdding"
                x-cloak
                title="Сохранить связь"
                @click="commitRelationAdd()">
          <i class="bi bi-floppy2"></i>
        </button>
      </div>
    </div>
{% else %}
  <section class="vor-overlay-section vor-add-relations">
    <div class="vor-add-section-head">
      <h3 x-text="relAdding ? 'Добавление' : 'Связи'">Связи</h3>
      <div class="vor-add-section-actions">
        <button type="button"
                class="sidebar-btn sidebar-btn-icon vor-relations-head-btn"
                x-show="relAdding"
                x-cloak
                title="Назад"
                @click="cancelRelationAdd()">
          <i class="bi bi-arrow-left"></i>
        </button>
        <button type="button"
                class="sidebar-btn sidebar-btn-add sidebar-btn-icon vor-relations-head-btn"
                x-show="!relAdding"
                title="Добавить связь"
                @click="startRelationAdd()">
          <i class="bi bi-plus-lg"></i>
        </button>
        <button type="button"
                class="sidebar-btn sidebar-btn-add sidebar-btn-icon vor-relations-head-btn"
                x-show="relAdding"
                x-cloak
                title="Сохранить связь"
                @click="commitRelationAdd()">
          <i class="bi bi-floppy2"></i>
        </button>
      </div>
    </div>
{% endif %}
  <div class="vor-relations-list" x-show="!relAdding">
    <template x-for="item in relations" :key="item.id || (item.type_key + '-' + item.work_id)">
      <div class="vor-relation-item"
           {% if allow_click_related %}:class="{ 'is-static': editing }" @click="!editing && openRelated(item)"{% else %}class="is-static"{% endif %}>
        <template x-if="item.cover_url">
          <img class="vor-relation-cover" :src="item.cover_url" :alt="item.title">
        </template>
        <template x-if="!item.cover_url">
          <div class="vor-relation-cover vor-relation-cover-empty">
            <i :class="item.icon"></i>
          </div>
        </template>
        <div class="vor-relation-meta">
          <div class="vor-relation-title" :title="item.title" x-text="item.title"></div>
          <div class="vor-relation-type" x-text="item.label"></div>
        </div>
        <div class="vor-relation-edit"
             {% if not is_add %}x-show="editing"{% endif %}
             x-cloak
             @click.outside="relTypeEdit = null">
          <div class="vor-relation-actions">
            <button type="button"
                    class="vor-relation-action"
                    title="Изменить тип связи"
                    @click.stop="toggleRelationType(item)">
              <i class="bi bi-pencil"></i>
            </button>
            <button type="button"
                    class="vor-relation-action vor-relation-action-delete"
                    title="Удалить связь"
                    @click.stop="removeRelation(item)">
              <i class="bi bi-x"></i>
            </button>
          </div>
          <div class="vor-relation-type-menu" x-show="relTypeEdit === relationKey(item)" x-cloak>
            <template x-for="opt in allowedRelationTypes(item.type_key)" :key="opt.value">
              <button type="button"
                      class="vor-relation-type-option"
                      :class="{ 'is-current': item.relation_type === opt.value }"
                      @click.stop="setRelationType(item, opt.value)"
                      x-text="opt.label"></button>
            </template>
          </div>
        </div>
      </div>
    </template>
    <div class="vor-relations-empty" x-show="!relations.length">Нет связей</div>
  </div>
  <div class="vor-relation-add" x-show="relAdding" x-cloak>
    <input class="vor-chip-picker-search"
           type="text"
           placeholder="Поиск произведения"
           x-model="relQuery"
           @input.debounce.250ms="searchRelatedWorks()">
    <div class="vor-relation-add-list">
      <template x-for="hit in relResults" :key="hit.type_key + '-' + hit.work_id">
        <button type="button"
                class="vor-relation-item vor-relation-pick"
                :class="{ 'is-selected': relPick && relPick.work_id === hit.work_id && relPick.type_key === hit.type_key }"
                @click="relPick = hit">
          <template x-if="hit.cover_url">
            <img class="vor-relation-cover" :src="hit.cover_url" :alt="hit.title">
          </template>
          <template x-if="!hit.cover_url">
            <div class="vor-relation-cover vor-relation-cover-empty">
              <i :class="hit.icon"></i>
            </div>
          </template>
          <div class="vor-relation-meta">
            <div class="vor-relation-title" x-text="hit.title"></div>
          </div>
        </button>
      </template>
      <div class="vor-relations-empty" x-show="relQuery && !relResults.length">Ничего не найдено</div>
    </div>
    <div class="vor-relation-add-type" x-show="relPick">
      <div class="vor-relation-add-type-head">
        <span class="vor-field-label">Тип связи</span>
        <span class="vor-relation-add-hint">(текущее → выбранное)</span>
      </div>
      <div class="vor-relation-type-choices">
        <template x-for="opt in allowedRelationTypes(relPick && relPick.type_key)" :key="opt.value">
          <button type="button"
                  class="vor-relation-type-option"
                  :class="{ 'is-current': relPickType === opt.value }"
                  @click="relPickType = opt.value"
                  x-text="opt.label"></button>
        </template>
      </div>
    </div>
  </div>
  {% if not is_add %}
    </aside>
  {% else %}
    </section>
  {% endif %}

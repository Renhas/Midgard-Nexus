<div class="vor-age-wrap"
     {% if not is_add %}x-show="editing || ageRating"{% endif %}
     @click.outside="ageOpen = false"
     @wheel.prevent="{% if not is_add %}editing && {% endif %}onAgeWheel($event)">
    <button type="button"
            class="vor-age-badge"
            :data-age="ageRating"
            {% if not is_add %}:disabled="!editing" :title="ageLabel()"{% endif %}
            @click="{% if not is_add %}editing && {% endif %}(ageOpen = !ageOpen)">
        <span x-text="ageRating || '—'">{% if not is_add and work.age_rating %}{{ work.age_rating }}{% endif %}</span>
    </button>
    <div class="vor-age-menu" x-show="{% if not is_add %}editing && {% endif %}ageOpen" x-cloak>
        <button type="button"
                class="vor-age-option"
                data-age=""
                :class="{ 'is-current': !ageRating }"
                @click="setAgeRating('')">—</button>
        <template x-for="opt in ageChoices" :key="opt.value">
            <button type="button"
                    class="vor-age-option"
                    :data-age="opt.value"
                    :class="{ 'is-current': ageRating === opt.value }"
                    @click="setAgeRating(opt.value)"
                    x-text="opt.label"></button>
        </template>
    </div>
    {% if not is_add %}
        <input type="hidden" name="age_rating" :value="ageRating">
    {% endif %}
</div>

{% load vor_archives_extras %}
<div class="vor-cover-wrap">
  <img class="vor-view-cover" x-show="coverPreview" :src="coverPreview" :alt="title">
  <div class="vor-view-cover vor-view-cover-empty" x-show="!coverPreview">
    {% if not is_add %}
      <i class="{{ work|get_model_icon }}" x-show="!editing"></i>
      <button type="button"
              class="vor-cover-btn vor-cover-btn-upload"
              x-show="editing"
              x-cloak
              title="Загрузить обложку"
              @click="$refs.coverInput.click()">
        <i class="bi bi-upload"></i>
      </button>
    {% else %}
      <button type="button"
              class="vor-cover-btn vor-cover-btn-upload"
              title="Загрузить обложку"
              @click="$refs.coverInput.click()">
        <i class="bi bi-upload"></i>
      </button>
    {% endif %}
  </div>
  <div class="vor-cover-actions"
       {% if not is_add %}x-show="editing && coverPreview" x-cloak{% else %}x-show="coverPreview"{% endif %}>
    <button type="button"
            class="vor-cover-btn vor-cover-btn-edit"
            title="Заменить обложку"
            @click="$refs.coverInput.click()">
      <i class="bi bi-pencil"></i>
    </button>
    <button type="button" class="vor-cover-btn vor-cover-btn-clear" title="Очистить обложку" @click="clearCover()">
      <i class="bi bi-x"></i>
    </button>
  </div>
  <div class="vor-cover-warning" x-show="coverWarning" x-cloak x-text="coverWarning"></div>
</div>

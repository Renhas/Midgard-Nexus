<div class="vor-status-dropdown" @click.outside="statusOpen = false">
  <button type="button"
          class="sidebar-select vor-status-dropdown__select"
          :class="'status-' + status"
          @click="statusOpen = !statusOpen">
    <span x-text="statusLabel()"></span>
  </button>
  <div class="vor-status-dropdown__menu" x-show="statusOpen" x-cloak>
    <template x-for="opt in statusChoices" :key="opt.value">
      <button type="button"
              class="vor-status-dropdown__option"
              :class="['status-' + opt.value, { 'vor-status-dropdown__option--current': status === opt.value }]"
              @click="setStatus(opt.value)"
              x-text="opt.label"></button>
    </template>
  </div>
</div>

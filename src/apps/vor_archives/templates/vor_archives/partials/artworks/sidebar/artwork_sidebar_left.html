<div class="sidebar-nav">
  <div class="sidebar-nav-row">
    <button type="button"
            class="sidebar-btn sidebar-btn-primary"
            title="Медиатека"
            :class="{ 'active': !$store.vorArtworks.collectionId }"
            @click="$store.vorArtworks.selectLibrary()">
      <i class="bi bi-collection"></i>
      <span>Медиатека</span>
    </button>
    <button type="button" class="sidebar-btn sidebar-btn-icon" title="Поиск" @click="$store.vorArtworks.openSearch()">
      <i class="bi bi-search"></i>
    </button>
  </div>
  <div class="sidebar-nav-row">
    <button type="button"
            class="sidebar-btn sidebar-btn-add"
            title="Добавить"
            x-show="!$store.vorArtworks.deleteMode"
            hx-get="{% url 'vor_archives:artworks:add' %}"
            hx-target="#vor-overlay"
            hx-swap="innerHTML">
      <i class="bi bi-plus-circle"></i>
    </button>
    <button type="button"
            class="sidebar-btn sidebar-btn-add"
            title="Отменить"
            x-show="$store.vorArtworks.deleteMode"
            x-cloak
            @click="$store.vorArtworks.exitDeleteMode()">
      <i class="bi bi-x-circle"></i>
    </button>
    <button type="button"
            class="sidebar-btn sidebar-btn-delete"
            title="Удалить"
            x-show="!$store.vorArtworks.deleteMode"
            @click="$store.vorArtworks.enterDeleteMode()">
      <i class="bi bi-trash"></i>
    </button>
    <button type="button"
            class="sidebar-btn sidebar-btn-delete"
            title="Подтвердить"
            x-show="$store.vorArtworks.deleteMode"
            x-cloak
            :disabled="!$store.vorArtworks.selectedIds.length"
            @click="$store.vorArtworks.openPreview()">
      <i class="bi bi-check-lg"></i>
    </button>
  </div>
  <hr class="sidebar-divider">
  <div class="sidebar-collections">
    <div class="sidebar-collections-header">
      <span>Коллекции</span>
    </div>
    <div id="sidebar-collections-list" class="sidebar-collections-list">
      {% include "vor_archives/partials/collections/collection_tree.html" %}
    </div>
    <button type="button"
            class="sidebar-btn sidebar-btn-add sidebar-btn-full"
            title="Добавить коллекцию"
            hx-get="{% url 'vor_archives:collections:new' %}"
            hx-target="#vor-modal"
            hx-swap="innerHTML">
      <i class="bi bi-plus-circle"></i>
      <span>Добавить коллекцию</span>
    </button>
  </div>
</div>

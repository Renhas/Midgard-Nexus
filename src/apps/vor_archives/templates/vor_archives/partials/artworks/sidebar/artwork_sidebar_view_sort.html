{# ========== ОТОБРАЖЕНИЕ ============ #}
<div class="sidebar-nav-row">
  <button type="button"
          class="sidebar-btn sidebar-btn-display"
          :class="{ 'active': $store.vorArtworks.viewMode === 'list' }"
          @click="$store.vorArtworks.setViewMode('list')"
          title="Список">
    <i class="bi bi-list-ul"></i>
  </button>
  <button type="button"
          class="sidebar-btn sidebar-btn-display"
          :class="{ 'active': $store.vorArtworks.viewMode === 'grid' }"
          @click="$store.vorArtworks.setViewMode('grid')"
          title="Плитки">
    <i class="bi bi-grid"></i>
  </button>
</div>
{# ========== СОРТИРОВКА ============ #}
<div class="sidebar-nav-row">
  <button type="button"
          class="sidebar-btn sidebar-btn-icon"
          @click="$store.vorArtworks.toggleSortDir()"
          title="Изменить направление">
    <i class="bi" :class="$store.vorArtworks.sortAsc ? 'bi-sort-down-alt' : 'bi-sort-up-alt'"></i>
  </button>
  <select class="sidebar-select"
          :value="$store.vorArtworks.sortField"
          @change="$store.vorArtworks.setSortField($event.target.value)">
    {% for field in sort_fields %}
      <option value="{{ field.value }}">{{ field.label }}</option>
    {% endfor %}
  </select>
</div>

<div id="vor-context-menu"
     class="vor-context-menu"
     x-data
     x-show="$store.vorArtworks.menu.open"
     x-cloak
     :class="{ 'has-flyout': $store.vorArtworks.menu.flyout }"
     :style="`left: ${$store.vorArtworks.menu.x}px; top: ${$store.vorArtworks.menu.y}px`"
     @contextmenu.prevent
     @wheel.stop
     @scroll.stop>
    <template x-if="$store.vorArtworks.menu.kind === 'collection'">
        <div>
            <button type="button" class="vor-context-item" @click="$store.vorArtworks.menuRenameCollection()">
                <i class="bi bi-pencil"></i>
                <span>Переименовать</span>
            </button>
            <button type="button"
                    class="vor-context-item"
                    :class="{ 'is-disabled': !$store.vorArtworks.menu.canNudgeUp }"
                    :disabled="!$store.vorArtworks.menu.canNudgeUp"
                    @click="$store.vorArtworks.nudgeCollection(-1)">
                <i class="bi bi-arrow-up"></i>
                <span>Вверх</span>
            </button>
            <button type="button"
                    class="vor-context-item"
                    :class="{ 'is-disabled': !$store.vorArtworks.menu.canNudgeDown }"
                    :disabled="!$store.vorArtworks.menu.canNudgeDown"
                    @click="$store.vorArtworks.nudgeCollection(1)">
                <i class="bi bi-arrow-down"></i>
                <span>Вниз</span>
            </button>
            <button type="button"
                    class="vor-context-item"
                    :class="{ 'is-disabled': !$store.vorArtworks.menu.canLevelUp }"
                    :disabled="!$store.vorArtworks.menu.canLevelUp"
                    @click="$store.vorArtworks.shiftCollectionLevel(-1)">
                <i class="bi bi-box-arrow-up-left"></i>
                <span>Уровень вверх</span>
            </button>
            <button type="button"
                    class="vor-context-item"
                    :class="{ 'is-disabled': !$store.vorArtworks.menu.canLevelDown }"
                    :disabled="!$store.vorArtworks.menu.canLevelDown"
                    @click="$store.vorArtworks.shiftCollectionLevel(1)">
                <i class="bi bi-box-arrow-in-down-right"></i>
                <span>Уровень вниз</span>
            </button>
            <button type="button" class="vor-context-item is-danger" @click="$store.vorArtworks.menuDeleteCollection()">
                <i class="bi bi-trash"></i>
                <span>Удалить</span>
            </button>
        </div>
    </template>
    <template x-if="$store.vorArtworks.menu.kind === 'artwork'">
        <div>
            <button type="button" class="vor-context-item" @click="$store.vorArtworks.menuEditArtwork()">
                <i class="bi bi-pencil"></i>
                <span>Редактировать</span>
            </button>
            <button type="button"
                    class="vor-context-item"
                    :class="{ 'is-disabled': !$store.vorArtworks.menu.canNudgeUp }"
                    :disabled="!$store.vorArtworks.menu.canNudgeUp"
                    @click="$store.vorArtworks.nudgeArtwork(-1)">
                <i class="bi bi-arrow-up"></i>
                <span>Вверх</span>
            </button>
            <button type="button"
                    class="vor-context-item"
                    :class="{ 'is-disabled': !$store.vorArtworks.menu.canNudgeDown }"
                    :disabled="!$store.vorArtworks.menu.canNudgeDown"
                    @click="$store.vorArtworks.nudgeArtwork(1)">
                <i class="bi bi-arrow-down"></i>
                <span>Вниз</span>
            </button>
            <button type="button"
                    class="vor-context-item has-submenu"
                    @mouseenter="$store.vorArtworks.openCollectionFlyout()"
                    @mouseleave="$store.vorArtworks.scheduleCloseFlyout()"
                    @click.stop="$store.vorArtworks.toggleCollectionFlyout()">
                <span>
                    <i class="bi bi-folder"></i>
                    <span>Коллекции</span>
                </span>
                <i class="bi bi-chevron-right"></i>
            </button>
            <button type="button"
                    class="vor-context-item"
                    x-show="$store.vorArtworks.menu.canRemoveFromCollection"
                    @click="$store.vorArtworks.removeFromCurrentCollection()">
                <i class="bi bi-folder-minus"></i>
                <span>Убрать из коллекции</span>
            </button>
            <button type="button" class="vor-context-item is-danger" @click="$store.vorArtworks.menuDeleteArtwork()">
                <i class="bi bi-trash"></i>
                <span>Удалить</span>
            </button>
        </div>
    </template>
    <div class="vor-context-flyout"
         x-show="$store.vorArtworks.menu.flyout && $store.vorArtworks.menu.kind === 'artwork'"
         x-cloak
         :style="`left: ${$store.vorArtworks.menu.flyoutX}px; top: ${$store.vorArtworks.menu.flyoutY}px`"
         @mouseenter="$store.vorArtworks.cancelCloseFlyout()"
         @mouseleave="$store.vorArtworks.scheduleCloseFlyout()"
         @mousedown.stop
         @click.stop
         @wheel.stop
         @scroll.stop>
        <div class="vor-context-flyout-empty" x-show="$store.vorArtworks.menu.membershipLoading">
            Загрузка…
        </div>
        <div class="vor-context-flyout-empty"
             x-show="!$store.vorArtworks.menu.membershipLoading && !$store.vorArtworks.menu.membership.length">
            Нет коллекций
        </div>
        <template x-for="item in $store.vorArtworks.menu.membership" :key="'member-' + item.id">
            <button type="button"
                    class="vor-context-item"
                    :class="{ 'is-checked': item.in_collection }"
                    :style="`padding-left: ${0.65 + item.level * 0.85}rem`"
                    @click.stop="$store.vorArtworks.toggleWorkCollection(item)">
                <i class="bi" :class="item.in_collection ? 'bi-check-square' : 'bi-square'"></i>
                <span x-text="item.name"></span>
            </button>
        </template>
    </div>
</div>

{% if owned %}
  <section class="vor-panel vor-search__segment">
    <h3 class="vor-search__segment-title">Ваши произведения</h3>
    <ul class="vor-search__results">
      {% for item in owned %}
        <li class="vor-search__result">
          <button type="button"
                  class="vor-search__result-main"
                  @click="$store.vorArtworks.openWork('{{ item.detail_url }}')">
            <i class="{{ item.icon }}"></i>
            {% if item.cover_url %}
              <img class="vor-search__cover" src="{{ item.cover_url }}" alt="">
            {% else %}
              <div class="vor-search__cover vor-search__cover-empty">
                <i class="{{ item.icon }}"></i>
              </div>
            {% endif %}
            <span class="vor-search__result-title">{{ item.title }}</span>
          </button>
        </li>
      {% endfor %}
    </ul>
  </section>
{% endif %}
{% if other %}
  <section class="vor-panel vor-search__segment">
    <h3 class="vor-search__segment-title">Новые для вас</h3>
    <ul class="vor-search__results">
      {% for item in other %}
        <li class="vor-search__result">
          <button type="button"
                  class="vor-search__result-main"
                  @click="$store.vorArtworks.openWork('{{ item.detail_url }}')">
            <i class="{{ item.icon }}"></i>
            {% if item.cover_url %}
              <img class="vor-search__cover" src="{{ item.cover_url }}" alt="">
            {% else %}
              <div class="vor-search__cover vor-search__cover-empty">
                <i class="{{ item.icon }}"></i>
              </div>
            {% endif %}
            <span class="vor-search__result-title">{{ item.title }}</span>
          </button>
          <button type="button"
                  class="sidebar-btn sidebar-btn--add sidebar-btn--icon"
                  title="Добавить"
                  @click.stop="$store.vorArtworks.attachFromSearch('{{ item.type_key }}', {{ item.work_id }}, '{{ item.title|escapejs }}', '{{ item.detail_url|escapejs }}')">
            <i class="bi bi-plus-lg"></i>
          </button>
        </li>
      {% endfor %}
    </ul>
  </section>
{% endif %}
{% if query and not owned and not other %}
  <div class="vor-search__empty">Ничего не найдено</div>
{% endif %}

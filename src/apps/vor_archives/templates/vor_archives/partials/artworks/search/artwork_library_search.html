<div class="vor-backdrop" x-show="$store.vorArtworks.searchOpen" x-cloak @click.self="$store.vorArtworks.closeSearch()">
  <div class="vor-search-panel"
       :class="{ 'vor-search-panel--with-query': String($store.vorArtworks.searchQuery || '').trim() }">
    <div class="vor-search vor-search--modal">
      <i class="bi bi-search vor-search-icon"></i>
      <input id="vor-library-search-input"
             class="form-control vor-search-input"
             type="text"
             x-model="$store.vorArtworks.searchQuery"
             @input="$store.vorArtworks.onSearchInput()"
             placeholder="Поиск"
             autocomplete="off">
    </div>
    <div id="vor-library-search-results" x-data></div>
  </div>
</div>

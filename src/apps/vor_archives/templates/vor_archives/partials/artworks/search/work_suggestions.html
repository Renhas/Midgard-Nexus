{% load vor_archives_extras %}
<div hidden x-init="alreadyOwned = {{ already_owned|yesno:'true,false' }}"></div>
{% if works %}
    <ul class="vor-suggestions-list">
        {% for work in works %}
            <li>
                <button type="button"
                        class="vor-suggestion-item"
                        data-work-id="{{ work.pk }}"
                        data-preview-url="{% url 'vor_archives:artworks:preview' %}?type={{ work_type }}&work_id={{ work.pk }}">
                    <i class="{{ work|get_model_icon }}"></i>
                    <span class="vor-suggestion-title">{{ work.title }}</span>
                    {% if work.release_date %}
                        <span class="vor-suggestion-year">{{ work.release_date|date:'Y' }}</span>
                    {% endif %}
                </button>
            </li>
        {% endfor %}
    </ul>
{% endif %}

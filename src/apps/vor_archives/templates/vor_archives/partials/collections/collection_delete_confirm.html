<div class="vor-backdrop" x-data @click.self="$dispatch('vor:close-modal')">
  <div class="vor-modal" @click.stop>
    <h3 class="vor-modal-title">Удалить коллекцию</h3>
    <p class="vor-modal-text">Коллекция «{{ collection.name }}» будет удалена.</p>
    {% if child_count %}
      <div class="vor-modal-warning">
        Вместе с ней будут удалены вложенные коллекции ({{ child_count }}).
        Произведения останутся в медиатеке.
      </div>
    {% endif %}
    <form class="vor-modal-actions" hx-post="{% url 'vor_archives:collections:delete' collection.pk %}" hx-swap="none">
      {% csrf_token %}
      <button type="button" class="sidebar-btn" @click="$dispatch('vor:close-modal')">Отмена</button>
      <button type="submit" class="sidebar-btn sidebar-btn-delete">Удалить</button>
    </form>
  </div>
</div>

<div class="collection-tree-node" data-collection-id="{{ collection.pk }}">
    <div class="collection-item"
         data-collection-id="{{ collection.pk }}"
         data-collection-name="{{ collection.name }}">
        <button type="button"
                class="collection-toggle"
                title="Свернуть/Развернуть">
            {% if collection.get_children %}
                <i class="bi bi-chevron-right"></i>
            {% else %}
                <span class="collection-toggle-placeholder"></span>
            {% endif %}
        </button>
        <span class="collection-item-name">{{ collection.name }}</span>
    </div>
    <div class="collection-children" data-parent-id="{{ collection.pk }}">
        {% for child in collection.get_children %}
            {% include "vor_archives/partials/collections/collection_tree_item.html" with collection=child %}
        {% endfor %}
    </div>
</div>

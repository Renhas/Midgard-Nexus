<div class="vor-collection-tree-node" data-collection-id="{{ collection.pk }}">
  <div class="vor-collection-item"
       data-collection-id="{{ collection.pk }}"
       data-collection-name="{{ collection.name }}">
    <button type="button"
            class="vor-collection-toggle"
            title="Свернуть/Развернуть"
            {% if not collection.get_children %}tabindex="-1" aria-hidden="true"{% endif %}>
      {% if collection.get_children %}
        <i class="bi bi-chevron-right"></i>
      {% else %}
        <span class="vor-collection-toggle-placeholder"></span>
      {% endif %}
    </button>
    <button type="button" class="vor-collection-item-name">{{ collection.name }}</button>
  </div>
  <div class="vor-collection-children" data-parent-id="{{ collection.pk }}">
    {% for child in collection.get_children %}
      {% include "vor_archives/partials/collections/collection_tree_item.html" with collection=child %}
    {% endfor %}
  </div>
</div>

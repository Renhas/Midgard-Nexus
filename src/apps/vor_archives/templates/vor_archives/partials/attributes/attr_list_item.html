<div class="vor-attr-item"
     data-attr-id="{{ item.key }}"
     :class="{
         'vor-attr-item--active': $store.vorAttributes.selectedKey === '{{ item.key }}',
         'vor-attr-item--selected': $store.vorAttributes.isSelected('{{ item.key }}')
     }"
     hx-get="{{ item.detail_url }}"
     hx-target="#attr-detail"
     hx-swap="innerHTML"
     hx-disinherit="hx-include"
     @click="$store.vorAttributes.select('{{ item.key }}')">
  <div class="vor-attr-item-check">
    <span class="vor-checkbox"
          :class="{ 'vor-checkbox--checked': $store.vorAttributes.isSelected('{{ item.key }}') }"></span>
  </div>
  <span class="vor-attr-item-name">{{ item.name }}</span>
  <span class="vor-attr-item-count">({{ item.work_count }})</span>
</div>

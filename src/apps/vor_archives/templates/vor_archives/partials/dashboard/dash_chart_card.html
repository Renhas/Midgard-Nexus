<article class="vor-dash-card vor-dash-card--chart">
  <div class="vor-dash-card-title">{{ title }}</div>
  <div class="vor-dash-chart-canvas-wrap">
    <p class="vor-dash-empty" x-show="!({{ show_expr }})" x-cloak>Нет данных для графика</p>
    <canvas x-ref="{{ ref }}" x-show="{{ show_expr }}"></canvas>
  </div>
</article>

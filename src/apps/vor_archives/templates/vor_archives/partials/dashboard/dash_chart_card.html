<article class="vor-dash-card vor-dash-card--chart">
  <div class="vor-dash-card__title">{{ title }}</div>
  <div class="vor-dash-card__chart-wrap">
    <p class="vor-dash__empty" x-show="!({{ show_expr }})" x-cloak>Нет данных для графика</p>
    <canvas x-ref="{{ ref }}" x-show="{{ show_expr }}"></canvas>
  </div>
</article>

<div class="artwork-list-header">
    <div class="artwork-row-check"></div>
    <div class="artwork-row-type"></div>
    <div class="artwork-row-title">Название</div>
    <div class="artwork-row-year">Год</div>
    <div class="artwork-row-status">Статус</div>
    <div class="artwork-row-rating">Рейтинг</div>
    <div class="artwork-row-progress">Прогресс</div>
    <div class="artwork-row-delete-slot"></div>
</div>
{% if user_works %}
    <div id="artwork-list-items" class="artwork-list-items">
        {% for user_work in user_works %}
            {% include "vor_archives/partials/artwork_row.html" with user_work=user_work %}
        {% endfor %}
    </div>
{% else %}
    <div class="text-center text-muted py-4">
        Произведения не найдены
    </div>
{% endif %}

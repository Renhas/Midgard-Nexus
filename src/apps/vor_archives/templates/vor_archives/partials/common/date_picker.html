<div class="vor-date-popup" x-show="dateOpen" x-cloak>
    <div class="vor-date-nav">
        <button type="button" class="sidebar-btn sidebar-btn-icon" @click="shiftDateNav(-1)">
            <i class="bi bi-chevron-left"></i>
        </button>
        <button type="button"
                class="vor-date-head"
                :class="{ 'is-static': dateView === 'years' }"
                :disabled="dateView === 'years'"
                @click="onDateHeaderClick()"
                x-text="dateHeaderLabel()"></button>
        <button type="button" class="sidebar-btn sidebar-btn-icon" @click="shiftDateNav(1)">
            <i class="bi bi-chevron-right"></i>
        </button>
    </div>
    <div x-show="dateView === 'days'">
        <div class="vor-date-week">
            <template x-for="day in ['Пн','Вт','Ср','Чт','Пт','Сб','Вс']" :key="day">
                <span x-text="day"></span>
            </template>
        </div>
        <div class="vor-date-grid">
            <template x-for="cell in dateCells()" :key="cell.key">
                <button type="button"
                        class="vor-date-day"
                        :class="{ 'is-muted': !cell.current, 'is-selected': cell.iso === releaseDate }"
                        @click="setReleaseDate(cell.iso)"
                        x-text="cell.day"></button>
            </template>
        </div>
    </div>
    <div class="vor-date-grid vor-date-grid-pick" x-show="dateView === 'months'" x-cloak>
        <template x-for="(month, index) in monthCells()" :key="month">
            <button type="button"
                    class="vor-date-day vor-date-pick"
                    :class="{ 'is-selected': isMonthSelected(index) }"
                    @click="selectMonth(index)"
                    x-text="month"></button>
        </template>
    </div>
    <div class="vor-date-grid vor-date-grid-pick" x-show="dateView === 'years'" x-cloak>
        <template x-for="year in yearCells()" :key="year">
            <button type="button"
                    class="vor-date-day vor-date-pick"
                    :class="{ 'is-selected': isYearSelected(year) }"
                    @click="selectYear(year)"
                    x-text="year"></button>
        </template>
    </div>
    <div class="vor-date-actions">
        <button type="button" class="vor-date-today" @click="setTodayDate()">Сегодня</button>
        <button type="button" class="vor-date-clear" @click="setReleaseDate('')">Очистить</button>
    </div>
</div>

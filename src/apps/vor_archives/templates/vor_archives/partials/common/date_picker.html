<div class="vor-panel vor-date__popup" x-show="dateOpen" x-cloak>
  <div class="vor-date__nav">
    <button type="button" class="sidebar-btn sidebar-btn--icon" @click="shiftDateNav(-1)">
      <i class="bi bi-chevron-left"></i>
    </button>
    <button type="button"
            class="vor-date__head"
            :class="{ 'vor-date__head--static': dateView === 'years' }"
            :disabled="dateView === 'years'"
            @click="onDateHeaderClick()"
            x-text="dateHeaderLabel()"></button>
    <button type="button" class="sidebar-btn sidebar-btn--icon" @click="shiftDateNav(1)">
      <i class="bi bi-chevron-right"></i>
    </button>
  </div>
  <div x-show="dateView === 'days'">
    <div class="vor-date__week">
      <template x-for="day in ['Пн','Вт','Ср','Чт','Пт','Сб','Вс']" :key="day">
        <span x-text="day"></span>
      </template>
    </div>
    <div class="vor-date__grid">
      <template x-for="cell in dateCells()" :key="cell.key">
        <button type="button"
                class="vor-date__day"
                :class="{ 'vor-date__day--muted': !cell.current, 'vor-date__day--selected': cell.iso === releaseDate }"
                @click="setReleaseDate(cell.iso)"
                x-text="cell.day"></button>
      </template>
    </div>
  </div>
  <div class="vor-date__grid vor-date__grid--pick" x-show="dateView === 'months'" x-cloak>
    <template x-for="(month, index) in monthCells()" :key="month">
      <button type="button"
              class="vor-date__day vor-date__pick"
              :class="{ 'vor-date__day--selected': isMonthSelected(index) }"
              @click="selectMonth(index)"
              x-text="month"></button>
    </template>
  </div>
  <div class="vor-date__grid vor-date__grid--pick" x-show="dateView === 'years'" x-cloak>
    <template x-for="year in yearCells()" :key="year">
      <button type="button"
              class="vor-date__day vor-date__pick"
              :class="{ 'vor-date__day--selected': isYearSelected(year) }"
              @click="selectYear(year)"
              x-text="year"></button>
    </template>
  </div>
  <div class="vor-date__actions">
    <button type="button" class="vor-date__today" @click="setTodayDate()">Сегодня</button>
    <button type="button" class="vor-date__clear" @click="setReleaseDate('')">Очистить</button>
  </div>
</div>

{{ charts_opts|json_script:"dash-charts-opts" }}
<div class="dash-page dash-charts" x-data="vorDashCharts()">
    <section class="dash-chart-pane">
        <div class="dash-segment-head">
            <h2 class="dash-segment-title">Распределение</h2>
            <div class="dash-chart-fields">
                {% for field in pie_fields %}
                <button type="button"
                        class="sidebar-btn"
                        :class="{ 'active': pieField === '{{ field.key }}' }"
                        @click="setPieField('{{ field.key }}')">
                    {{ field.label }}
                </button>
                {% endfor %}
            </div>
        </div>
        <div class="dash-chart-canvas-wrap">
            <p class="dash-empty" x-show="!pieItems.length" x-cloak>Нет данных для графика</p>
            <canvas id="dash-pie-chart" x-show="pieItems.length"></canvas>
        </div>
    </section>

    <section class="dash-chart-pane">
        <div class="dash-segment-head">
            <h2 class="dash-segment-title">Атрибуты</h2>
            <div class="dash-attr-toggles">
                <div class="dash-chart-fields">
                    {% for kind in attr_kinds %}
                    <button type="button"
                            class="sidebar-btn"
                            :class="{ 'active': attrKind === '{{ kind.key }}' }"
                            @click="setAttrKind('{{ kind.key }}')"
                            title="{{ kind.label }}">
                        <i class="{{ kind.icon }}"></i>
                        <span>{{ kind.label }}</span>
                    </button>
                    {% endfor %}
                </div>
                <div class="dash-chart-fields">
                    <button type="button"
                            class="sidebar-btn"
                            :class="{ 'active': attrView === 'cloud' }"
                            @click="setAttrView('cloud')"
                            title="Облако">
                        <i class="bi bi-cloud"></i>
                    </button>
                    <button type="button"
                            class="sidebar-btn"
                            :class="{ 'active': attrView === 'bar' }"
                            @click="setAttrView('bar')"
                            title="Гистограмма">
                        <i class="bi bi-bar-chart"></i>
                    </button>
                    <button type="button"
                            class="sidebar-btn"
                            :class="{ 'active': attrView === 'list' }"
                            @click="setAttrView('list')"
                            title="Список">
                        <i class="bi bi-list-ul"></i>
                    </button>
                </div>
            </div>
        </div>

        <div class="dash-attr-body">
            <p class="dash-empty" x-show="!attrItems.length" x-cloak>Атрибутов пока нет</p>

            <div class="dash-attr-cloud" x-show="attrView === 'cloud' && attrItems.length" x-cloak>
                <template x-for="item in cloudItems" :key="item.name">
                    <span class="dash-cloud-tag"
                          :style="`font-size: ${item.fontSize}rem`"
                          x-text="item.name"
                          :title="`${item.count} · ${formatPercent(item.percent)}`"></span>
                </template>
            </div>

            <div class="dash-chart-canvas-wrap" x-show="attrView === 'bar' && attrItems.length" x-cloak>
                <canvas id="dash-bar-chart"></canvas>
            </div>

            <div class="dash-attr-list" x-show="attrView === 'list' && attrItems.length" x-cloak>
                <template x-for="item in attrItems" :key="item.name">
                    <div class="dash-attr-row">
                        <span class="dash-attr-name" x-text="item.name"></span>
                        <span class="dash-attr-count" x-text="item.count"></span>
                        <span class="dash-attr-pct" x-text="formatPercent(item.percent)"></span>
                    </div>
                </template>
            </div>
        </div>
    </section>
</div>

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
pythonpath = ["src"]
python_files = ["test_*.py", "tests.py"]
addopts = "-q --strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src"]
exclude = [
    ".venv",
    "**/migrations/**",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.5
    hooks:
      - id: ruff
      - id: ruff-format
  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell
        exclude: >
          (?x)^(
            .*\.min\.(js|css)|
            .*/migrations/.*|
            .*/static/vendor/.*
          )$
  - repo: https://github.com/djlint/djLint
    rev: v1.47.1
    hooks:
      - id: djlint-reformat-django
      - id: djlint-django
